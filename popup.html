<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <style>
    .footer-meta {
  margin-top: 16px;
  font-size: 10px;
  color: #C7C7CC;
  text-align: center;
  letter-spacing: 0.3px;
}
    :root {
      --bg: #FAFAFA;
      --card-bg: #FFFFFF;
      --text-main: #1C1C1E;
      --text-muted: #8E8E93;
      --primary: #000000;
      --primary-hover: #333333;
      --border: #E5E5EA;
      --radius: 14px;
    }
    body {
      width: 340px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
    }
    h2 { font-size: 16px; margin: 0 0 12px 0; font-weight: 600; }
    
    /* --- 新增：立即自動登入開關區塊 --- */
    .quick-start-box {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .al-toggle {
      width: 46px; height: 26px; background-color: #E5E5EA;
      border-radius: 15px; position: relative; cursor: pointer;
      transition: background-color 0.3s ease; flex-shrink: 0;
      box-shadow: inset 0 0 2px rgba(0, 0, 0, 0.05);
    }
    .al-toggle-knob {
      width: 22px; height: 22px; background-color: #FFFFFF; border-radius: 50%;
      position: absolute; top: 2px; left: 2px; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s cubic-bezier(0.25, 0.1, 0.25, 1.2);
    }
    .al-toggle.active { background-color: #34C759; }
    .al-toggle.active .al-toggle-knob { transform: translateX(20px); }
    .quick-start-text {
      font-size: 14px; font-weight: 600; transition: color 0.3s;
    }
    /* ---------------------------------- */

    .status-box {
      background: #E5F0FF; color: #0056D2; padding: 10px;
      border-radius: 10px; font-size: 13px; font-weight: 500;
      margin-bottom: 16px; line-height: 1.4;
    }
    .form-group { margin-bottom: 12px; display: flex; flex-direction: column; }
    label { font-size: 12px; margin-bottom: 4px; color: var(--text-muted); font-weight: 500; }
    input, select {
      background: var(--card-bg); border: 1px solid var(--border);
      padding: 8px 10px; border-radius: 8px; font-size: 13px; outline: none;
      width: 100%; box-sizing: border-box; transition: border-color 0.2s;
    }
    input:focus, select:focus { border-color: #007AFF; }
    .date-group { display: flex; gap: 6px; }
    .schedule-box {
      background: rgba(0,0,0,0.03); padding: 12px; border-radius: 10px;
      display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px;
    }
    .schedule-header { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
    .schedule-header input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }
    .schedule-note { font-size: 11px; color: #FF3B30; font-weight: 500; }
    .current-time { font-size: 11px; color: #C7C7CC; text-align: right; margin-top: 4px; }
    button.save-btn {
      width: 100%; background-color: var(--primary); color: #FFF; border: none;
      padding: 10px; border-radius: 10px; font-size: 14px; font-weight: 500;
      cursor: pointer; transition: background-color 0.2s;
    }
    button.save-btn:hover { background-color: var(--primary-hover); }
    .save-msg {
      margin-top: 8px; font-size: 12px; text-align: center;
      color: #34C759; opacity: 0; transition: opacity 0.3s;
    }
    
  </style>
</head>
<body>
  <h2>⚙️ 自動登入設定</h2>
  
  <!-- 立即啟動開關 -->
  <div class="quick-start-box">
    <div class="al-toggle" id="quickStartToggle">
      <div class="al-toggle-knob"></div>
    </div>
    <div class="quick-start-text" id="quickStartText">手動立即自動登入</div>
  </div>

  <div id="popupStatus" class="status-box">讀取任務狀態中...</div>

  <div class="form-group">
    <label>身分證字號</label>
    <input type="text" id="idNo" placeholder="A123456789" maxlength="10">
  </div>
  
  <div class="form-group">
    <label>出生日期 (民國/西元皆可)</label>
    <div class="date-group">
      <input type="number" id="birthYear" placeholder="年">
      <input type="number" id="birthMonth" placeholder="月" min="1" max="12">
      <input type="number" id="birthDay" placeholder="日" min="1" max="31">
    </div>
  </div>

  <div class="form-group">
    <label>手機號碼</label>
    <input type="tel" id="phone" placeholder="09XXXXXXXX" maxlength="10">
  </div>

  <div class="schedule-box">
    <div class="schedule-header">
      <input type="checkbox" id="autoOpenEnabled"> 啟用自動排程登入
    </div>
    <div class="date-group">
      <select id="autoOpenDay">
        <option value="1">每週一</option>
        <option value="2">每週二</option>
        <option value="3">每週三</option>
        <option value="4">每週四</option>
        <option value="5">每週五</option>
        <option value="6">每週六</option>
        <option value="7">每週日</option>
      </select>
      <input type="time" id="autoOpenTime">
    </div>
    <div class="schedule-note">※ 勾選並儲存後，時間到將忽略開關自動登入。</div>
    <div id="sysTime" class="current-time"></div>
  </div>

  <button id="saveBtn" class="save-btn">儲存設定</button>
  <div id="statusMsg" class="save-msg">設定已儲存！</div>

  <script src="popup.js"></script>
  <div class="footer-meta">
  v1.1.0 · Developed by <a href="https://github.com/blues32767/sport115-sweat-autologin/" target="_blank" rel="noopener" style="color:#007AFF; text-decoration:none;">blues32767</a> · 2026/09/02
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg: #FAFAFA;
      --card-bg: #FFFFFF;
      --text-main: #1C1C1E;
      --text-muted: #8E8E93;
      --primary: #000000;
      --primary-hover: #333333;
      --border: #E5E5EA;
      --radius: 14px;
    }
    body {
      width: 320px;
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
    }
    h2 {
      font-size: 18px;
      margin: 0 0 16px 0;
      font-weight: 600;
      letter-spacing: -0.5px;
    }
    .form-group {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
    }
    label {
      font-size: 13px;
      margin-bottom: 6px;
      color: var(--text-muted);
      font-weight: 500;
    }
    input {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }
    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0,0,0,0.05);
    }
    .date-group {
      display: flex;
      gap: 8px;
    }
    .date-group input {
      width: 100%;
    }
    button {
      margin-top: 16px;
      width: 100%;
      background-color: var(--primary);
      color: #FFF;
      border: none;
      padding: 12px;
      border-radius: var(--radius);
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    button:hover {
      background-color: var(--primary-hover);
    }
    .status {
      margin-top: 12px;
      font-size: 13px;
      text-align: center;
      color: #34C759;
      opacity: 0;
      transition: opacity 0.3s;
    }
  </style>
</head>
<body>
  <h2>⚙️ 自動登入設定</h2>
  
  <div class="form-group">
    <label for="idNo">身分證字號</label>
    <input type="text" id="idNo" placeholder="A123456789" maxlength="10">
  </div>
  
  <div class="form-group">
    <label>出生日期 (民國/西元皆可)</label>
    <div class="date-group">
      <input type="number" id="birthYear" placeholder="年 (如 77)">
      <input type="number" id="birthMonth" placeholder="月" min="1" max="12">
      <input type="number" id="birthDay" placeholder="日" min="1" max="31">
    </div>
  </div>

  <div class="form-group">
    <label for="phone">手機號碼</label>
    <input type="tel" id="phone" placeholder="09XXXXXXXX" maxlength="10">
  </div>

  <button id="saveBtn">儲存設定</button>
  <div id="statusMsg" class="status">設定已儲存！</div>

  <script src="popup.js"></script>
</body>
</html>
